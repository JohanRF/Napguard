<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NapGuard</title>
	<link rel="stylesheet" href="../css/timer.css">
	<script src="https://kit.fontawesome.com/4e26a4ebf9.js" crossorigin="anonymous"></script>
</head>
<body>
    
	<!-- =============================
        VISTA 1: SETTINGS
        Primera pantalla al abrir la app
    ============================== -->
	<div id="vistaSettings">
		<!--? Barra superior -->
		<div class="topBar">
			<span class="appName">Nap<span class="accent">Guard</span></span>

			<button id="btnSkip" style="background: red; color: white; border: none; border-radius: 7px; font-family: 'Press Start 2P', monospace; font-size: 7px; padding: 8px; cursor: pointer;">
				SKIP
			</button>

			<button id="btnModo" title="Cambiar modo claro/oscuro">
				<i id="iconoModo" class="fa-regular fa-moon"></i>
			</button>
		</div>

		<!-- ? Cuerpo del settings -->
		<!-- Total calculado -->
        <div class="totalBox">
            <p class="totalLabel">SESIÓN TOTAL</p>
            <p class="totalVal" id="totalSesion">2h 20min (140 min)</p>
        </div>
		
		<div class="settingsBody">

			<!-- Seccion tiempos -->
			<p class="sectionTitle">// TIEMPOS //</p>

			<div class="paramBlock">
				<div class="paramRow">
					<span class="paramName">CONCENTRACIÓN</span>
					<input type="number" class="paramVal" id="valConcentracion" value="30" min="1" max="120">
				</div>
				<input type="range" id="sliderConcentracion" min="1" max="120" value="30" step="1">
			</div>

			<div class="paramBlock">
				<div class="paramRow">
					<span class="paramName">DESCANSO</span>
					<input type="number" class="paramVal" id="valDescanso" value="5" min="1" max="60">
				</div>
				<input type="range" id="sliderDescanso" min="1" max="60" value="5" step="1">
			</div>

			<div class="paramBlock">
                <div class="paramRow">
                    <span class="paramName">CICLOS</span>
                    <input type="number" class="paramVal" id="valCiclos" value="4" min="1" max="10">
                </div>
                <input type="range" id="sliderCiclos" min="1" max="10" value="4" step="1">
            </div>

			<!-- Diseño de descanso -->
			<p class="sectionTitle">// DISEÑO DE DESCANSO //</p>

			<!-- TABS — siempre visibles -->
			<div class="tabsRow">
				<button class="tabBtn active" id="tabImagenes">Imágenes</button>
				<button class="tabBtn" id="tabGif">GIF/Sticker</button>
				<button class="tabBtn" id="tabCustom">Custom</button>
			</div>

			<!-- CONTENIDO TAB: Imágenes -->
			<div id="panelImagenes" class="tabPanel">

				<!-- Vista A — lista de categorías -->
				<div id="vistaCategorias">
					<div class="categoriaOpt" data-categoria="animales">
						<i class="fa-solid fa-paw"></i>
						<span>Animales</span>
						<i class="fa-solid fa-chevron-right"></i>
					</div>
					<div class="categoriaOpt" data-categoria="anime">
						<i class="fa-solid fa-star"></i>
						<span>Anime</span>
						<i class="fa-solid fa-chevron-right"></i>
					</div>
					<div class="categoriaOpt" data-categoria="futbol">
						<i class="fa-solid fa-futbol"></i>
						<span>Fútbol</span>
						<i class="fa-solid fa-chevron-right"></i>
					</div>
				</div>

				<!-- Vista B — imágenes de la categoría seleccionada -->
				<div id="vistaImagenesCat" class="oculto">
					<div class="contenidoHeader">
						<button id="btnVolverCategorias">
							<i class="fa-solid fa-arrow-left"></i>
						</button>
						<span id="tituloCategoriaActual">Animales</span>
					</div>
					<div class="imagenesGrid" id="imagenesGrid">
						<!-- Se generan con JS según la categoría -->
					</div>
				</div>

			</div>

			<!-- CONTENIDO TAB: GIF/Sticker -->
			<div id="panelGif" class="tabPanel oculto">
				
				<!-- Buscador -->
				<div class="gifSearchWrap">
					<i class="fa-solid fa-magnifying-glass"></i>
					<input type="text" id="inputBuscarGif" placeholder="Buscar...">
				</div>

				<!-- Tabs GIF / Sticker -->
				<div class="gifTabs">
					<button class="gifTabBtn active" id="btnTabGif">GIFs</button>
					<button class="gifTabBtn" id="btnTabSticker">Stickers</button>
				</div>

				<!-- Grid de resultados -->
				<div class="gifGrid" id="gifGrid">
					<div class="gifPlaceholder">
						<i class="fa-solid fa-magnifying-glass"></i>
						<span>Escribe algo para buscar</span>
					</div>
				</div>

			</div>

			<!-- CONTENIDO TAB: Custom -->
			<div id="panelCustom" class="tabPanel oculto">
				<div class="customGrid" id="customGrid">
					<!-- Imágenes del usuario generadas con JS -->
				</div>
			</div>

			<!-- Botón empezar — siempre al fondo -->
			<div class="btnMainStart">
				<button id="btnEmpezar">
					EMPEZAR <i class="fa-solid fa-play"></i>
				</button>
			</div>

		</div>
	</div>

	<!-- =============================
        VISTA 1.5: TIMER
        Se muestra al presionar Empezar
    ============================== -->

	<!-- =============================
        VISTA 2: TIMER
        Se muestra al presionar Empezar
    ============================== -->
	<div id="vistaTimer" class="oculto">

		<!-- Barra superior -->
		<div class="topBar">
			<span class="appName">Nap<span class="accent">Guard</span></span>
			<button id="btnModo2" title="Cambiar modo claro/oscuro">
				<i id="iconoModo2" class="fa-regular fa-moon"></i>
			</button>
		</div>

		<!-- Cuerpo del timer -->
		<div class="timerBody">

			<!-- Estado actual -->
			<span id="estadoActual" class="estadoBadge">Concentración</span>

			<!-- Reloj circular -->
			<div class="clockWrap">
				<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
                    <!-- Círculo de fondo -->
                    <circle class="ringBg" cx="90" cy="90" r="80"/>
                    <!-- Círculo de progreso -->
                    <circle class="ringProgress" id="ringProgress" cx="90" cy="90" r="80"/>
                </svg>
				<!-- Punto central -->
                <div class="clockDot"></div>
			</div>

			<!-- Indicador de ciclos -->
			<div class="ciclosRow" id="ciclosRow">
				<!-- Los cuadraditos se generan en JS según los ciclos configurados -->
			</div>

			<!-- Total de sesión -->
			<div class="sesionTag" id="sesionTag">
				Sesión total: 2h 30min (150min)
			</div>

			<!-- Controles -->
			<div class="controlesRow">
				<button id="btnIniciarPausar">
					<i class="fa-solid fa-play"></i> INICIAR
				</button>
				<button id="btnSettings">VOLVER</button>
			</div>
		</div>
	</div>
	
	<script src="../js/timer.js"></script>
</body>
</html>
